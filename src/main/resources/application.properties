spring.application.name=demo
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=true

# ==========================================
# DATABASE CONNECTION
# ==========================================
# Values now come from environment variables so the same jar/image
# works locally AND in production (Render, Docker, etc) without
# editing this file. Defaults below match your old local MySQL setup,
# so nothing changes if you don't set the env vars.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/amateur_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

# Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ==========================================
# SERVER PORT
# ==========================================
# Render/most hosts inject PORT automatically; falls back to 5027 locally.
server.port=${PORT:5027}

# ==========================================
# EMAIL SETTINGS (Gmail)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:evodiphinince@gmail.com}
spring.mail.password=${MAIL_PASSWORD:kbqt mpte vmuo pppv}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
